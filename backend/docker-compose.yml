services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/smartmarket.db
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://rate-limiter:6379/0}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    depends_on:
      rate-limiter:
        condition: service_healthy
  rate-limiter:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
