api:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /app/data/smartmarket.db
      RATELIMIT_STORAGE_URI: ${RATELIMIT_STORAGE_URI:-redis://rate-limiter:6379/0}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      CHAT_RATE_LIMIT: ${CHAT_RATE_LIMIT}
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    depends_on:
      rate-limiter:
        condition: service_healthy
